name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package non-editable with test extra and build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]' build
      - name: Run test suite
        run: |
          python -m pytest
      - name: Check installed CLI outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          dsa-preprocess --help
      - name: Build wheel and sdist
        run: |
          python -m build
          python scripts/normalize_sdist.py dist/*.tar.gz

  demons:
    name: demons registration (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package with test and registration extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test,registration]'
      - name: Run Demons registration tests
        run: |
          python -m pytest -q
